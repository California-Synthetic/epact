[workspace]
members = [
    "crates/epact-protocol",
    "crates/epact-compiler",
    "crates/epact-runtime",
    "crates/epact-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/California-Synthetic/epact"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
